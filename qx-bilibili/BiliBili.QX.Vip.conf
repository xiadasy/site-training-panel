[rewrite_local]
^https:\/\/(?:grpc\.biliapi\.net|app\.bilibili\.com)\/bilibili\.app\.playerunite\.v1\.Player\/PlayViewUnite url script-request-body https://xiadasy.github.io/site-training-panel/qx-bilibili/bilibili.vip.qx.js, binary-body-mode=true
^https?:\/\/app\.bilibili\.com\/x\/v2\/account\/ url script-response-body https://xiadasy.github.io/site-training-panel/qx-bilibili/bili_myinfo_vip.js

[mitm]
hostname = grpc.biliapi.net, app.bilibili.com
